<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tập đọc</title>
    <link rel="stylesheet" href="style1.css">
</head>

<body>
    <div>
        <h1>BỐN MÙA</h1>
        <p>
            Xuân về hoa nở khắp trời<br>
            Hạ sang nắng cháy rạng ngời phố quen<br>
            Thu về lá rụng bên thềm<br>
        </p>
        <hr>
        <p style="color: #D40000 ;">
            Đông sang gió lạnh bên em đợi chờ<br>
            Bốn mùa là bốn giấc mơ<br>
            Thời gian đi mãi ta đợi chờ ai<br>
        </p>
        <hr>
        <p>
            Một năm rồi lại một năm<br>
            Vẫn còn câu hát thì thầm quê hương<br>
            Chờ xuân nắng mới soi đường<br>
        </p>
    </div>
</body>

</html>
